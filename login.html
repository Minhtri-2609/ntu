<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon1.png">
    <link rel="preload" as="image" href="img.jpg">
    <title>Đăng nhập / Đăng ký</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('img.jpg');
            background-size: cover;
            background-position: center;
        }

        .container {
            position: relative;
            width: 400px;
            height: 450px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, .2);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 10px rgba(0, 0, 0, .2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: height .2s ease;
        }

        .container.active {
            height: 520px;
        }

        .form-box {
            position: absolute;
            width: 100%;
            padding: 40px;
            transition: transform .3s ease;
        }

        .form-box.login {
            transform: translateX(0);
        }

        .container.active .form-box.login {
            transform: translateX(-400px);
        }

        .form-box.register {
            transform: translateX(400px);
        }

        .container.active .form-box.register {
            transform: translateX(0);
        }

        h1 {
            font-size: 36px;
            text-align: center;
            color: #fff;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 30px 0;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            border: 2px solid rgba(255, 255, 255, .2);
            border-radius: 40px;
            font-size: 16px;
            color: #fff;
            padding: 20px 45px 20px 20px;
        }

        .input-box input::placeholder {
            color: #fff;
        }

        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #fff;
        }

        .forgot-link {
            margin: -15px 0 15px;
            text-align: center;
        }

        .forgot-link a {
            font-size: 14.5px;
            color: #fff;
            text-decoration: none;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            height: 45px;
            background: #fff;
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
            cursor: pointer;
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }
        
        .btn:hover {
            background: #e2e2e2;
        }

        p {
            font-size: 14.5px;
            color: #fff;
            text-align: center;
            margin: 20px 0 10px;
        }

        p a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }

        p a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .container {
                width: 100%;
                height: 100vh;
                border: none;
                border-radius: 0;
            }
        }
        .back-home {
            position: absolute;
            top: 40px;      /* Căn cách từ trên xuống */
            left: 40px;     /* Căn cách từ trái sang */
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1); /* Nền kính mờ đồng bộ với form */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px); /* Hiệu ứng rê chuột sẽ trượt nhẹ nút sang trái */
        }
        /* Hiện dần khi vào trang */
        body {
    animation: pageIn .5s ease backwards;
    transition: opacity .3s ease;
        }
        body.page-leave { opacity: 0; }

        .container {
    animation: cardIn .6s cubic-bezier(.2, .8, .2, 1) backwards;
        }

        @keyframes pageIn {
    from { opacity: 0; }
    to   { opacity: 1; }
        }

        @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.96); }
    to   { opacity: 1; transform: none; }
        }
        .form-msg {
    min-height: 1.2em;
    margin: -10px 0 10px;
    color: #ffd2d2;
    font-size: 13.5px;
        }
    </style>
</head>
<body>
    <a href="https://tlamthat.id.vn" class="back-home">← Trở về Trang chủ</a>
    <div class="container">
        <div class="form-box login">
            <form action="#">
                <h1>Đăng nhập</h1>
                <div class="input-box">
                    <input type="text" placeholder="Tên người dùng" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Mật khẩu" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Quên mật khẩu?</a>
                </div>
                <p class="form-msg" role="alert"></p>
                <button type="submit" class="btn">Đăng nhập</button>
                <p>Chưa có tài khoản? <a href="#" class="register-link">Đăng ký</a></p>
            </form>
        </div>

        <div class="form-box register">
            <form action="#">
                <h1>Đăng ký</h1>
                <div class="input-box">
                    <input type="text" placeholder="Tên người dùng" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="Email" required>
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Mật khẩu" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <p class="form-msg" role="alert"></p>
                <button type="submit" class="btn">Đăng ký</button>
                <p>Đã có tài khoản? <a href="#" class="login-link">Đăng nhập</a></p>
            </form>
        </div>
    </div>

<script>
const container = document.querySelector('.container');
const registerLink = document.querySelector('.register-link');
const loginLink = document.querySelector('.login-link');
// Chỉ đổi địa chỉ khi đã đưa lên web, không đổi khi chạy thử ở máy
const CLEAN_URL = !["127.0.0.1", "localhost"].includes(location.hostname);

function setMode(isRegister, push) {
    container.classList.toggle('active', isRegister);
    if (push && CLEAN_URL) {
        history.pushState(null, "", isRegister ? "/sign-in" : "/login");
    }
}

registerLink.addEventListener('click', (e) => {
    e.preventDefault();
    setMode(true, true);
});

loginLink.addEventListener('click', (e) => {
    e.preventDefault();
    setMode(false, true);
});

// Nút Back/Forward của trình duyệt
addEventListener('popstate', () => {
    setMode(/sign-in(\.html)?$/.test(location.pathname), false);
});

// Mở thẳng /sign-in thì hiện luôn form đăng ký
if (/sign-in(\.html)?$/.test(location.pathname)) {
    container.classList.add('active');
}

// Bỏ ".html" trên thanh địa chỉ
if (CLEAN_URL && location.pathname.endsWith(".html")) {
    history.replaceState(null, "", location.pathname.replace(/\.html$/, "") + location.search);
}
document.querySelector('.back-home').addEventListener('click', function (e) {
    e.preventDefault();
    document.body.classList.add('page-leave');
    setTimeout(() => { location.href = this.href; }, 300);
});
addEventListener('pageshow', () => document.body.classList.remove('page-leave'));
const API = CLEAN_URL ? "https://tr1ssca.pythonanywhere.com/api/me" : "";

function showMessage(form, text) {
    form.querySelector(".form-msg").textContent = text;
}

async function sendAuth(path, body, form) {
    const button = form.querySelector(".btn");
    button.disabled = true;
    showMessage(form, "");
    try {
        const response = await fetch(API + path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(body)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            showMessage(form, data.error || "Có lỗi xảy ra, vui lòng thử lại.");
            return;
        }
        try {
            localStorage.setItem("demo_session", JSON.stringify({ name: data.user.username }));
        } catch (error) {
            // Không lưu được cũng không sao.
        }
        location.href = CLEAN_URL ? "/" : "index.html";
    } catch (error) {
        showMessage(form, "Không kết nối được máy chủ. Vui lòng thử lại sau.");
    } finally {
        button.disabled = false;
    }
}

document.querySelector(".form-box.login form").addEventListener("submit", e => {
    e.preventDefault();
    const inputs = e.target.querySelectorAll("input");
    sendAuth("/api/login", { username: inputs[0].value, password: inputs[1].value }, e.target);
});

document.querySelector(".form-box.register form").addEventListener("submit", e => {
    e.preventDefault();
    const inputs = e.target.querySelectorAll("input");
    sendAuth("/api/register", { username: inputs[0].value, email: inputs[1].value, password: inputs[2].value }, e.target);
});
</script>
</body>
</html>
