<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1233"/>
      <stop offset=".45" stop-color="#1c2765"/>
      <stop offset=".72" stop-color="#6a4a8c"/>
      <stop offset=".9" stop-color="#d98a7a"/>
      <stop offset="1" stop-color="#f2bf7a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d5d8e"/>
      <stop offset=".25" stop-color="#27346e"/>
      <stop offset="1" stop-color="#080e28"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3cf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff3cf" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1600" height="900" fill="#000"/>
      <circle cx="1180" cy="210" r="62" fill="#fff"/>
      <circle cx="1208" cy="196" r="56" fill="#000"/>
    </mask>
  </defs>

  <rect width="1600" height="620" fill="url(#sky)"/>

  <!-- sao -->
  <g fill="#fff">
    <circle cx="120" cy="90" r="1.6" opacity=".9"/><circle cx="260" cy="150" r="1.2" opacity=".7"/>
    <circle cx="380" cy="60" r="1.8" opacity=".95"/><circle cx="470" cy="210" r="1.1" opacity=".6"/>
    <circle cx="590" cy="110" r="1.4" opacity=".8"/><circle cx="690" cy="40" r="1.2" opacity=".7"/>
    <circle cx="760" cy="190" r="1.7" opacity=".9"/><circle cx="880" cy="95" r="1.1" opacity=".6"/>
    <circle cx="960" cy="260" r="1.3" opacity=".7"/><circle cx="1020" cy="55" r="1.8" opacity=".95"/>
    <circle cx="1090" cy="150" r="1.2" opacity=".7"/><circle cx="1330" cy="80" r="1.5" opacity=".85"/>
    <circle cx="1420" cy="180" r="1.1" opacity=".6"/><circle cx="1500" cy="70" r="1.7" opacity=".9"/>
    <circle cx="1550" cy="240" r="1.2" opacity=".7"/><circle cx="60" cy="260" r="1.1" opacity=".6"/>
    <circle cx="190" cy="330" r="1.3" opacity=".6"/><circle cx="640" cy="300" r="1" opacity=".5"/>
    <circle cx="1260" cy="330" r="1.2" opacity=".55"/><circle cx="1470" cy="330" r="1.3" opacity=".6"/>
    <circle cx="840" cy="320" r="1" opacity=".5"/><circle cx="330" cy="250" r="1.4" opacity=".7"/>
  </g>

  <!-- trăng -->
  <circle cx="1190" cy="205" r="150" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="#f6efd8" mask="url(#crescent)"/>

  <!-- núi xa -->
  <path d="M0 520 C120 470 220 440 330 470 C430 495 500 430 610 450 C720 470 780 520 900 515 C1030 510 1100 470 1230 480 C1360 490 1480 460 1600 500 V640 H0Z" fill="#3a3a86" opacity=".75"/>
  <path d="M0 560 C140 520 250 500 380 530 C500 556 590 520 700 540 C820 562 900 585 1040 560 C1180 535 1290 520 1410 548 C1490 566 1550 560 1600 552 V640 H0Z" fill="#26286a"/>

  <!-- biển -->
  <rect y="600" width="1600" height="300" fill="url(#sea)"/>
  <!-- vệt trăng trên mặt nước -->
  <g stroke="#f6efd8" stroke-linecap="round" opacity=".5">
    <path d="M1130 640 H1250" stroke-width="3"/>
    <path d="M1150 668 H1230" stroke-width="3"/>
    <path d="M1105 698 H1255" stroke-width="2.5"/>
    <path d="M1140 730 H1215" stroke-width="2.5"/>
    <path d="M1090 765 H1240" stroke-width="2"/>
    <path d="M1130 805 H1200" stroke-width="2"/>
  </g>
  <g stroke="#9aa6e8" stroke-linecap="round" opacity=".18" stroke-width="2">
    <path d="M200 650 H340"/><path d="M420 690 H560"/><path d="M90 720 H250"/>
    <path d="M600 760 H760"/><path d="M300 800 H470"/><path d="M820 700 H940"/>
  </g>

  <!-- thuyền nhỏ -->
  <g transform="translate(730 646)">
    <path d="M-46 0 H46 L30 16 H-30Z" fill="#0a1030"/>
    <path d="M0 0 V-62" stroke="#0a1030" stroke-width="3"/>
    <path d="M4 -58 C28 -40 34 -20 36 -6 H4Z" fill="#0a1030"/>
    <path d="M-4 -46 C-18 -30 -22 -16 -24 -6 H-4Z" fill="#0a1030" opacity=".9"/>
  </g>

  <!-- núi gần phía trước, bên trái -->
  <path d="M0 640 C90 600 170 590 260 620 C340 646 400 690 470 740 C520 776 560 820 600 900 H0Z" fill="#0d1236"/>
  <!-- con đường uốn -->
  <path d="M120 900 C210 820 300 790 360 760 C420 730 440 700 420 676" fill="none" stroke="#c9a56e" stroke-width="5" stroke-linecap="round" opacity=".55" stroke-dasharray="2 14"/>
  <!-- người đứng -->
  <g transform="translate(418 654)" fill="#05081e">
    <circle cx="0" cy="-30" r="7"/>
    <path d="M-8 -22 H8 L10 12 H-10Z"/>
  </g>

  <!-- tiêu đề chính -->
  <g text-anchor="middle" font-family="'Brush Script MT','Segoe Script','Snell Roundhand',cursive">
    <text x="706" y="408" font-size="200" fill="#05081e" opacity=".35">Vận Mệnh</text>
    <text x="700" y="400" font-size="200" fill="#fdf3dd">Vận Mệnh</text>
  </g>
  <!-- tên tác giả phía trên tiêu đề -->
  <g fill="#fdf3dd" opacity=".9">
    <rect x="470" y="228" width="70" height="2"/>
    <rect x="860" y="228" width="70" height="2"/>
    <text x="700" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" letter-spacing="8">MINH TRÍ</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
