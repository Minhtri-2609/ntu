    <!-- Kế thừa giao diện chung -->

    <script>

    <style>
        /* ===== STYLE RIÊNG CHO TRANG PROFILE ===== */
        body {
            padding-top: 40px;
            padding-bottom: 60px;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--mut);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 20px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .back-home:hover {
            color: var(--blue);
            transform: translateX(-4px);
        }

        .profile-container {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(11, 31, 68, 0.08);
            animation: cardIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
        }

        /* Ảnh bìa */
        .cover-photo {
            width: 100%;
            height: 240px;
            background-color: var(--head);
            /* Thay link ảnh bìa của bạn vào URL bên dưới */
            background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .profile-header-content {
            padding: 0 30px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: -65px;
            position: relative;
        }

        .profile-user-details {
            display: flex;
            align-items: flex-end;
            gap: 24px;
        }

        /* Avatar tròn */
        .profile-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid var(--card);
            background: var(--bg);
            object-fit: cover;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        .profile-text h1 {
            padding-top: 80px;
            font-size: 1.8rem;
            color: var(--head);
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .profile-text .nickname {
            display: inline-block;
            color: var(--blue);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 6px;
            background: rgba(29, 78, 216, 0.1);
            padding: 2px 10px;
            border-radius: 99px;
        }

        .profile-text .join-date {
            color: var(--mut);
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .profile-actions .btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
        }

        .profile-body {
            padding: 30px;
            border-top: 1px solid var(--line);
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .profile-section h3 {
            font-size: 1.15rem;
            color: var(--head);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-section h3 i {
            color: var(--cyan);
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            color: var(--mut);
            font-size: 0.92rem;
        }

        .info-list li i {
            font-size: 1.2rem;
            color: var(--blue);
            margin-top: 2px;
        }

        .info-list li strong {
            color: var(--ink);
            display: block;
        }

        .activity-timeline {
            position: relative;
            padding-left: 20px;
            border-left: 2px solid var(--line);
        }

        .activity-item {
            position: relative;
            margin-bottom: 24px;
        }

        .activity-item::before {
            content: '';
            position: absolute;
            left: -27px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--cyan);
            border: 2px solid var(--card);
        }

        .activity-item time {
            display: block;
            font-size: 0.8rem;
            color: var(--mut);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .activity-item p {
            color: var(--ink);
            font-size: 0.95rem;
            background: var(--bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--line);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(.98); }
            to   { opacity: 1; transform: none; }
        }

        @media (max-width: 768px) {
            .profile-header-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .profile-user-details {
                flex-direction: column;
                align-items: center;
                gap: 14px;
            }
            .profile-actions {
                margin-top: 24px;
            }
            .profile-body {
                grid-template-columns: 1fr;
            }
            .profile-text .join-date {
                justify-content: center;
            }
        }
        
        /* Đồng bộ Dark Mode bổ sung */
        html[data-theme="dark"] .profile-text .nickname {
            background: rgba(56, 189, 248, 0.15);
            color: #7dd3fc;
        }
        html[data-theme="dark"] .activity-item p {
            background: #0f172a;
        }

        /* ===== Tab Hoạt động / Bình luận ===== */
.profile-tabs {
    display: inline-flex;
    gap: 6px;
    padding: 4px;
    margin-bottom: 18px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
}

.ptab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--mut);
    font: inherit;
    font-size: .9rem;
    font-weight: 650;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
}

.ptab.is-active {
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    color: #ffffff;
}

.activity-timeline[hidden],
.comment-list[hidden] {
    display: none;
}

.comment-list {
    display: grid;
    gap: 12px;
}

.comment-item {
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
}

.comment-item small {
    display: block;
    margin-bottom: 4px;
    color: var(--mut);
    font-size: .8rem;
    font-weight: 600;
}

.comment-item p {
    color: var(--ink);
    overflow-wrap: anywhere;
}

.empty-note {
    color: var(--mut);
    font-size: .92rem;
}

/* ===== Cửa sổ nổi sửa hồ sơ ===== */
.modal {
    position: fixed;
    inset: 0;
    height: 100vh;           /* dự phòng cho trình duyệt cũ */
    height: 100dvh;          /* chiều cao thật, đã trừ thanh trình duyệt */
    z-index: 300;
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}

.modal[hidden] {
    display: none;
}

.modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(8, 15, 40, .55);
    backdrop-filter: blur(3px);
    animation: fadeIn .2s ease;
}

.modal-card {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(820px, 100%);
    max-height: calc(100vh - 32px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
    animation: modalIn .28s cubic-bezier(.2, .8, .2, 1);
}

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
}

.modal-head h2 {
    color: var(--head);
    font-size: 1.2rem;
}

.modal-x {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink);
    font-size: 1.3rem;
    cursor: pointer;
}

.modal-body {
    padding: 20px;
    overflow-y: auto;
}

.modal-foot {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
}

.modal-foot .btn {
    margin-top: 0;
}

/* Ảnh bìa và ảnh đại diện ở đầu cửa sổ */
.edit-media {

    margin-bottom: 60px;
}

.edit-cover {

.edit-avatar-wrap {

    gap: 10px;
}

.edit-avatar {

    border-radius: 50%;

}

.media-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border: 0;
    border-radius: 999px;
    background: rgba(11, 31, 68, .75);
    color: #ffffff;
    font: inherit;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
}

.edit-cover .media-btn {
    position: absolute;
    right: 10px;
    bottom: 10px;
}

.media-btn.small {
    margin-bottom: 6px;
    background: var(--blue);
}

/* Các ô nhập */
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field.full {
    grid-column: 1 / -1;
}

.field > span {
    color: var(--mut);
    font-size: .85rem;
    font-weight: 650;
}

.field input,
.tag-input {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
}

.field input:focus,
.tag-input:focus-within {
    border-color: var(--cyan);
    outline: none;
    box-shadow: 0 0 0 3px rgba(6, 182, 212, .18);
}

.tag-input {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-top: 0;
    padding-bottom: 0;
}

.tag-input input {
    flex: 1;
    padding: 10px 0;
    border: 0;
    background: none;
    box-shadow: none;
}

.form-error {
    min-height: 1.3em;
    margin-top: 12px;
    color: #dc2626;
    font-size: .88rem;
}

/* Thông báo nhỏ */
.p-toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 400;
    padding: 10px 18px;
    border-radius: 12px;
    background: #0b1f44;
    color: #ffffff;
    font-size: .92rem;
    opacity: 0;
    transform: translate(-50%, 20px);
    transition: opacity .3s ease, transform .3s ease;
}

.p-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

@keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}

@keyframes modalIn {
    from { opacity: 0; transform: translateY(16px) scale(.97); }
    to   { opacity: 1; transform: none; }
}

@media (max-width: 560px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}
.field select, .field textarea {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); font: inherit; width: 100%;
}
.field textarea { resize: none; }
.field select:disabled, .field textarea[readonly] { opacity: .8; cursor: not-allowed; }

<script>
function authFetch(url, options = {}) {
    let token = "";
    try { token = localStorage.getItem("auth_token") || ""; } catch (e) {}
    const headers = { ...(options.headers || {}) };
    if (token) headers.Authorization = "Bearer " + token;
    return fetch(url, { credentials: "include", ...options, headers });
}

const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
const API = LOCAL ? "http://127.0.0.1:5000" : "https://tr1ssca.pythonanywhere.com";
const POST_NAMES = { "don-nhan": "Đón Nhận" };

const $ = (selector) => document.querySelector(selector);
let profile = null;
let pending = { avatar: null, cover: null };     // ảnh mới chọn, chưa lưu

/* ---------- Tiện ích ---------- */
function toast(message) {
    const box = document.createElement("div");
    box.className = "p-toast";
    box.textContent = message;
    document.body.appendChild(box);
    requestAnimationFrame(() => box.classList.add("show"));
    setTimeout(() => {
        box.classList.remove("show");
        setTimeout(() => box.remove(), 300);
    }, 2600);
}

async function api(path, options = {}) {
    const response = await authFetch(API + path, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
    const error = new Error(data.error || "Máy chủ không phản hồi đúng (mã " + response.status + "). Vui lòng thử lại.");
        error.status = response.status;
        throw error;
    }
    return data;
}

function mediaUrl(path) {
    return path ? API + path : "";
}

function avatarUrl() {
    if (profile.avatar) return mediaUrl(profile.avatar);
    return "https://ui-avatars.com/api/?name=" + encodeURIComponent(profile.display_name) + "&background=155eef&color=fff&size=256";
}

function formatTime(value) {
    const date = new Date(value);
    return isNaN(date.getTime()) ? "" : date.toLocaleString("vi-VN");
}

function setInfo(id, value) {
    $("#" + id).textContent = value || "Chưa cập nhật";
}

/* ---------- Hiển thị hồ sơ ---------- */
function renderProfile() {
    $("#profileName").textContent = profile.display_name;
    $("#profileNickname").textContent = "@" + profile.nickname;
    $("#avatarImg").src = avatarUrl();
    $("#coverPhoto").style.backgroundImage = profile.cover ? 'url("' + mediaUrl(profile.cover) + '")' : "";

    const joined = new Date(profile.joined);
    if (!isNaN(joined.getTime())) {
        $("#profileJoined").textContent = "Tham gia tháng " + (joined.getMonth() + 1) + ", " + joined.getFullYear();
    }

    setInfo("infoSchool", profile.school);
    setInfo("infoMajor", profile.major);
    setInfo("infoFaculty", profile.faculty);
    setInfo("infoSpec", profile.specialization);
    setInfo("infoHome", profile.hometown);
    setInfo("profileEmail", profile.contact_email);
    setInfo("infoPhone", profile.phone);
    $("#rowSpec").style.display = profile.specialization ? "" : "none";   // chuyên ngành: có thì mới hiện

    // Cập nhật thông tin dùng cho thanh menu ở trang chủ
    try {
        localStorage.setItem("demo_session", JSON.stringify({ name: profile.display_name, avatar: profile.avatar }));
    } catch (e) {}
}

function emptyNote(text) {
    const note = document.createElement("p");
    note.className = "empty-note";
    note.textContent = text;
    return note;
}

function renderActivity(items) {
    const box = $("#panelActivity");
    box.innerHTML = "";
    if (!items.length) {
        box.appendChild(emptyNote("Chưa có hoạt động nào."));
        return;
    }
    items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "activity-item";
        const time = document.createElement("time");
        time.textContent = formatTime(item.time);
        const text = document.createElement("p");
        text.textContent = item.text;
        row.append(time, text);
        box.appendChild(row);
    });
}

function renderComments(items) {
    const box = $("#panelComments");
    box.innerHTML = "";
    if (!items.length) {
        box.appendChild(emptyNote("Bạn chưa có bình luận nào."));
        return;
    }
    items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "comment-item";
        const meta = document.createElement("small");
        meta.textContent = (POST_NAMES[item.post] || item.post) + " · " + formatTime(item.time);
        const text = document.createElement("p");
        text.textContent = item.content;
        row.append(meta, text);
        box.appendChild(row);
    });
}

async function loadLists() {
    try {
        renderActivity(await api("/api/profile/activity"));
        renderComments(await api("/api/profile/comments"));
    } catch (error) {
        toast(error.message);
    }
}

/* ---------- Hai tab: Hoạt động / Bình luận ---------- */
document.querySelectorAll(".ptab").forEach((tab) => {
    tab.addEventListener("click", () => {
        const showComments = tab.dataset.tab === "comments";
        document.querySelectorAll(".ptab").forEach((t) => t.classList.toggle("is-active", t === tab));
        $("#panelActivity").hidden = showComments;
        $("#panelComments").hidden = !showComments;
    });
});

/* ---------- Trường / Ngành / Khoa-Viện ---------- */
const SCHOOLS = window.SCHOOL_DATA || {};

function fillSchools() {
    const sel = $("#fSchool");
    sel.length = 1;
    Object.entries(SCHOOLS).forEach(([key, s]) => sel.add(new Option(s.label, key)));
}
function schoolKeyFromText(text) {
    return Object.keys(SCHOOLS).find((k) => (text || "").includes("(" + k + ")")) || "";
}
function updateFaculty() {
    const key = $("#fSchool").value;
    const code = $("#fMajor").value.split(" - ")[0];
    const m = key && SCHOOLS[key].majors.find((x) => x.code === code);
    $("#fFaculty").value = m ? m.faculty : "";
}
function fillMajors(key, selected) {
    const sel = $("#fMajor");
    sel.length = 1;
    sel.options[0].text = key ? "— Chọn ngành —" : "— Chọn trường trước —";
    sel.disabled = !key;
    if (key) SCHOOLS[key].majors.forEach((m) => {
        const text = m.code + " - " + m.name;      // dạng [mã ngành] - [Tên ngành]
        sel.add(new Option(text, text));
    });
    if (selected) {
        if (![...sel.options].some((o) => o.value === selected)) sel.add(new Option(selected, selected));
        sel.value = selected;
    }
    updateFaculty();
}
$("#fSchool").addEventListener("change", () => fillMajors($("#fSchool").value, ""));
$("#fMajor").addEventListener("change", updateFaculty);

/* ---------- Cửa sổ sửa hồ sơ ---------- */
function setError(message) {
    $("#editError").textContent = message;
}

function openModal() {
    pending = { avatar: null, cover: null };
    $("#fName").value = profile.display_name;
    $("#fNick").value = profile.nickname;
    fillSchools();
    const schoolKey = schoolKeyFromText(profile.school);
    $("#fSchool").value = schoolKey;
    fillMajors(schoolKey, profile.major);
    if (!$("#fFaculty").value) $("#fFaculty").value = profile.faculty || "";
    $("#fSpec").value = profile.specialization;
    $("#fEmail").value = profile.contact_email;
    $("#fPhone").value = profile.phone;
    $("#fHome").value = profile.hometown;
    $("#editAvatar").src = avatarUrl();
    $("#editCover").style.backgroundImage = profile.cover ? 'url("' + mediaUrl(profile.cover) + '")' : "";
    setError("");
    $("#editModal").hidden = false;
    document.body.style.overflow = "hidden";
    $("#fName").focus();
}

function closeModal() {
    $("#editModal").hidden = true;
    document.body.style.overflow = "";
}

$("#editBtn").addEventListener("click", openModal);
document.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", closeModal));
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("#editModal").hidden) closeModal();
});

/* ---------- Chọn ảnh: thu nhỏ ngay trên máy trước khi tải lên ---------- */
async function loadBitmap(file, maxWidth) {
    if (window.createImageBitmap) {
        if (maxWidth) {
            try { return await createImageBitmap(file, { resizeWidth: maxWidth, resizeQuality: "medium" }); } catch (e) {}
        }
        try { return await createImageBitmap(file); } catch (e) {}
    }
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Không đọc được ảnh này (có thể là ảnh HEIC). Hãy chọn ảnh JPG/PNG khác.")); };
        img.src = url;
    });
}

async function resizeImage(file, kind) {
    const bitmap = await loadBitmap(file, kind === "cover" ? 1280 : 0);
    const bw = bitmap.naturalWidth || bitmap.width;
    const bh = bitmap.naturalHeight || bitmap.height;
    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    if (kind === "avatar") {
        const side = Math.min(bw, bh);
        canvas.width = canvas.height = Math.min(side, 512);
        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(bitmap, (bw - side) / 2, (bh - side) / 2, side, side, 0, 0, canvas.width, canvas.height);
    } else {
        const scale = Math.min(1, 1280 / bw);              // giảm từ 1600 xuống 1280 cho nhẹ
        canvas.width = Math.round(bw * scale);
        canvas.height = Math.round(bh * scale);
        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    }
    if (bitmap.close) bitmap.close();

    return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("Không xử lý được ảnh."))), "image/jpeg", 0.82);
    });
}

async function handleFile(file, kind) {
    if (!file) return;
    const okType = /^image\//.test(file.type) || /\.(jpe?g|png|webp)$/i.test(file.name);
    if (!okType) { showErr("Chỉ chọn ảnh JPG, PNG hoặc WebP."); return; }
    try {
        const blob = await resizeImage(file, kind);
        pending[kind] = blob;
        const preview = URL.createObjectURL(blob);
        if (kind === "avatar") $("#editAvatar").src = preview;
        else $("#editCover").style.backgroundImage = 'url("' + preview + '")';
        setError("");
    } catch (error) {
        showErr(error.message);
    }
}
function showErr(message) { setError(message); toast(message); }   // hiện cả toast để điện thoại luôn thấy

document.querySelectorAll("[data-pick]").forEach((button) => {
    button.addEventListener("click", () => {$("#fileAvatar").addEventListener("change", async (e) => { const f = e.target.files[0]; await handleFile(f, "avatar"); e.target.value = ""; });
$("#fileCover").addEventListener("change", async (e) => { const f = e.target.files[0]; await handleFile(f, "cover"); e.target.value = ""; });
        $(button.dataset.pick === "cover" ? "#fileCover" : "#fileAvatar").click();
    });
});

$("#fileAvatar").addEventListener("change", async (e) => { const f = e.target.files[0]; await handleFile(f, "avatar"); e.target.value = ""; });
$("#fileCover").addEventListener("change", async (e) => { const f = e.target.files[0]; await handleFile(f, "cover"); e.target.value = ""; });

/* ---------- Lưu: tải ảnh mới (nếu có) rồi lưu thông tin, áp dụng ngay ---------- */
$("#editForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = $("#saveBtn");
    button.disabled = true;
    setError("");

    try {
        for (const kind of ["avatar", "cover"]) {
            if (!pending[kind]) continue;
            const body = new FormData();
            body.append("image", pending[kind], kind + ".jpg");
            await api("/api/profile/" + kind, { method: "POST", body: body });
        }

        profile = await api("/api/profile", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                display_name: $("#fName").value,
                nickname: $("#fNick").value,
                school: SCHOOLS[$("#fSchool").value] ? SCHOOLS[$("#fSchool").value].label : "",
                major: $("#fMajor").value,
                faculty: $("#fFaculty").value,
                specialization: $("#fSpec").value,
                contact_email: $("#fEmail").value,
                phone: $("#fPhone").value,
                hometown: $("#fHome").value
            })
        });

        pending = { avatar: null, cover: null };
        renderProfile();
        closeModal();
        toast("Đã lưu hồ sơ.");
        loadLists();
    } catch (error) {
        showErr(error.message);
    } finally {
        button.disabled = false;
    }
});

/* ---------- Khởi động ---------- */
(async function init() {
    try {
        profile = await api("/api/profile");
    } catch (error) {
        if (error.status === 401) {
            location.href = "login.html";       // chưa đăng nhập thì chuyển tới trang đăng nhập
            return;
        }
        toast(error.message);
        return;
    }
    renderProfile();
    loadLists();
})();
/* Bỏ ".html" trên thanh địa chỉ (chỉ khi đã đưa lên web) */
if (!LOCAL && location.pathname.endsWith(".html")) {
    history.replaceState(null, "", location.pathname.replace(/\.html$/, "") + location.search);
}
